# The only thing on the server that listens on 80 and 443, shared by every
# project on it. It gets the certificates and hands each domain to a project's
# container over the `edge` network; each project adds one file to sites/.
# Lives in /opt/edge, installed once by deploy/remote-release.sh.
name: edge

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - data:/data
      - config:/config
    networks:
      edge:
        # Fixed, because each project's server trusts X-Forwarded-For from
        # this address alone (deploy/web/Caddyfile). Other projects' containers
        # share the network and must not be able to claim a client's address.
        ipv4_address: 10.200.0.2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: edge
    # Outside Docker's default pools (172.17-31.x, 192.168.x), so a network
    # Docker assigns on its own can never take it first.
    ipam:
      config:
        - subnet: 10.200.0.0/24

volumes:
  data:
  config:
